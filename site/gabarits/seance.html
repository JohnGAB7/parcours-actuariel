<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>$titre · $site_title</title>
<link rel="icon" type="image/svg+xml" href="$favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://raw.githubusercontent.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="${base}assets/vendor/katex/katex.min.css">
<link rel="stylesheet" href="${base}assets/vendor/codemirror/codemirror.css">
<link rel="stylesheet" href="${base}assets/style.css">
<link rel="alternate" hreflang="fr" href="$alt_fr">
<link rel="alternate" hreflang="en" href="$alt_en">
</head>
<body>
<header class="bar gutter"><div class="bar-in">
  $marque
  <span class="where" id="where"></span>
  
  $bascule
  <a class="acct" href="${racine}compte/index.html" aria-label="$compte"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></a>
</div></header>
<div class="lesson-shell gutter">
  <aside class="lesson-rail" aria-label="$etapes">
    <div class="lesson-rail-heading"><span class="eyebrow">$progression</span><strong>$etapes</strong></div>
    <nav class="segs" id="segs" aria-label="$progression"></nav>
    <div class="lesson-rail-foot"><span class="rail-foot-mark">AB</span><span>LEARN · MODEL · PRACTICE</span></div>
  </aside>
  <div class="lesson-content">
    <div class="lesson-mode" id="lesson-mode" hidden>
      <button class="btn" id="mode-steps" type="button" aria-pressed="true">Parcours guidé</button>
      <button class="btn ghost" id="mode-reference" type="button" aria-pressed="false">Fiche autonome</button>
    </div>
    <section class="reference-sheet" id="reference-sheet" aria-label="Fiche de référence" hidden>
      <div class="reference-intro">
        <span class="eyebrow" id="reference-kicker">REFERENCE SHEET</span>
        <h1 id="reference-title"></h1>
        <p id="reference-notice"></p>
      </div>
      <nav class="reference-tabs" id="reference-tabs" role="tablist" aria-label="Sections de la fiche"></nav>
      <div class="reference-panels" id="reference-panels"></div>
    </section>
    <div class="lesson-pathway" id="lesson-pathway">
      <main class="stage" id="stage"></main>
      <nav class="pager" aria-label="$etapes">
      <button class="btn ghost" id="prev" type="button"></button>
      <button class="btn" id="next" type="button"></button>
      </nav>
    </div>
  </div>
</div>
<script type="application/json" id="seance">$donnees</script>
<script src="${base}assets/vendor/katex/katex.min.js"></script>
<script src="${base}assets/vendor/katex/auto-render.min.js"></script>
<script src="${base}assets/vendor/codemirror/codemirror.js"></script>
<script src="${base}assets/vendor/codemirror/python.js"></script>
<script src="${base}assets/vendor/codemirror/matchbrackets.js"></script>
<script src="${base}assets/vendor/codemirror/closebrackets.js"></script>
<script src="${base}assets/seance.js"></script>
<script src="${base}assets/fiche.js"></script>
<script src="${base}assets/math-render.js"></script>
<script src="${base}assets/langue.js"></script>
<script src="${base}assets/config.js"></script>
<script src="${base}assets/compte.js" data-base="${base}"></script>
</body>
</html>
