# English texts for session A1.05. Numbers, answers and tests live in contenus/a1/s05.yaml.
titre: "Bonds and the yield curve"

etapes:
  - titre: "Placement check"
    intro: "Four questions before the lesson. If you get them all right, skim the recap and go straight to the calculation."
    questions:
      - q: 'A bond with face value $F$ pays a coupon $c$ a year for $n$ years, then $F$. At yield $y$, its price is…'
        pourquoi:
          rappel: >-
            The price is the present value of all the promised cash flows: an annuity of coupons plus the final redemption.
          exemple: >-
            Face value €1,000, 5% coupon, 5 years, 4% yield: $P = 50 \times 4.4518 + 1{,}000 \times 0.8219 = 1{,}044.52$ euros.
          piege: >-
            $nc + F$ ignores discounting. $s_{\overline{n}|}$ would give a value at time $n$, not a price today.
      - q: 'If the yield rises, the bond price…'
        options: ['falls', 'rises', 'does not change']
        pourquoi:
          rappel: >-
            The cash flows are fixed by the contract. Discounting them at a higher rate makes them worth less.
          exemple: >-
            The same bond is worth €1,044.52 at 4%, €1,000 at 5% and €957.88 at 6%.
          piege: >-
            The bond does not "earn" more when rates rise: whoever already holds it loses value.
      - q: 'A bond trades above par (at a premium) when…'
        options: ['the coupon rate exceeds the yield', 'the yield exceeds the coupon rate', 'it is close to maturity']
        pourquoi:
          rappel: >-
            If the coupon pays more than the market, the buyer is willing to pay more than the face value to get it.
          exemple: >-
            A €50 coupon against $1{,}000 \times 4\% = 40$ euros from the market: a premium of $10 \times 4.4518 = 44.52$ euros.
          piege: >-
            Near maturity, the premium or discount shrinks towards zero, but that is not what creates it.
      - q: 'With spot rates $s_1 = 3\%$ and $s_2 = 3.5\%$, the one-year forward rate in one year $f_{1,\,2}$ is about…'
        options: ['4.0%', '3.25%', '3.5%']
        pourquoi:
          rappel: >-
            Investing for 2 years at the spot rate must be worth the same as investing for 1 year at the spot rate, then 1 year at the forward rate. Otherwise there would be a risk-free gain.
          exemple: >-
            $f_{1,\,2} = 1.035^2 / 1.03 - 1 = 1.071225 / 1.03 - 1 = 4.00\%$.
          piege: >-
            The average (3.25%) means nothing here. When the curve slopes up, the forward rate lies above both spot rates.

  - titre: "The intuition on video"
    texte: >-
      This topic does not have its Actu-Basics video yet. It will show, with a see-saw, why bond prices and
      interest rates always move in opposite directions.

  - titre: "The recap"
    blocs:
      - p: >-
          A <b>bond</b> <i>(obligation)</i> promises regular <b>coupons</b> <i>(coupons)</i> and the repayment of the
          <b>face value</b> <i>(nominal)</i> at <b>maturity</b> <i>(échéance)</i>. Its price is the present value of these
          cash flows at the <b>yield to maturity</b> <i>(taux de rendement à l'échéance)</i> $y$.
      - {}
      - p: >-
          The second formula says it all: a <b>premium</b> <i>(prime)</i> if the coupon exceeds the market yield, a
          <b>discount</b> <i>(décote)</i> otherwise, and a price at par if both are equal.
      - p: >-
          The market does not use a single rate. The <b>spot rate</b> <i>(taux spot)</i> $s_t$ discounts a single cash
          flow paid in $t$ years; the set of $s_t$ forms the <b>yield curve</b> <i>(courbe des taux)</i>. The
          <b>forward rate</b> <i>(taux à terme)</i> is the implied rate between two future dates.
      - {}
      - p: >-
          The yield $y$ of a bond is a kind of average of the spot rates, weighted by its cash flows. Two bonds with the
          same maturity but different coupons can have different yields.
      - note: >-
          A life insurer or a pension plan discounts its obligations with a yield curve, not a single rate. Matching the
          cash flows of its bonds to those of its obligations is asset-liability management (ALM), which you will see in
          the ALM domain.
      - sources:
          - {titre: "Kellison, The Theory of Interest, chap. 7 and 10", detail: "Bond prices, premium and discount, term structure of interest rates"}
          - {titre: "SOA, Financial Mathematics (FM) Exam", detail: "Official exam syllabus"}

  - titre: "Check"
    intro: "Four questions. Answer without rereading the recap."
    questions:
      - q: 'A bond with face value €1,000 pays a 5% coupon for 5 years. At a 5% yield, it is worth…'
        options: ['€1,000', '€1,044.52', '€1,250']
        pourquoi:
          rappel: >-
            When the coupon equals the yield, the premium $(c - Fy)\,a_{\overline{n}|}$ is zero.
          exemple: >-
            $50 = 1{,}000 \times 5\%$: the bond trades at par, €1,000.
          piege: >-
            €1,044.52 is its price at 4%. €1,250 adds up the cash flows without discounting.
      - q: 'The same bond, at a 6% yield, is worth about…'
        options: ['€957.88', '€1,042.12', '€1,000']
        pourquoi:
          rappel: >-
            The yield exceeds the coupon: the bond trades at a discount.
          exemple: >-
            $50 \times 4.2124 + 1{,}000 \times 0.7473 = 957.88$ euros, a discount of €42.12.
          piege: >-
            €1,042.12 puts the discount on the wrong side. The price falls when the rate rises.
      - q: 'With $s_1 = 3\%$, $s_2 = 3.5\%$, $s_3 = 4\%$, what is the forward rate $f_{2,\,3}$?'
        options: ['5.01%', '4.00%', '3.75%']
        pourquoi:
          rappel: >-
            Compare a 3-year investment with a 2-year investment extended by one year.
          exemple: >-
            $1.124864 / 1.071225 = 1.050073$, so $f_{2,\,3} = 5.01\%$.
          piege: >-
            4.00% is $f_{1,\,2}$. On an upward-sloping curve, forward rates rise faster than spot rates.
      - q: 'A 3-year bond, 5% coupon, face value €1,000, is worth €1,028.67 with this curve. Its yield is…'
        options: ['a little under 4%', 'exactly 4%', '5%']
        pourquoi:
          rappel: >-
            The yield is the single rate that gives back the same price. It blends the three spot rates, weighted by the cash flows.
          exemple: >-
            We find $y = 3.97\%$: almost all the weight is on the last cash flow, discounted at 4%, but the coupons pull a little towards 3% and 3.5%.
          piege: >-
            The yield is not the spot rate at maturity. It also depends on the coupons.

  - titre: "By hand"
    intro: "Face value €1,000, annual coupon of 5%. $P_5$: 5-year bond at yield $y$. $P_3$: 3-year bond with the spot curve. Prices to the cent, rates to 4 decimal places."
    donnees:
      entetes: ['$s_1$', '$s_2$', '$s_3$', '$y$']
      lignes: [['3%', '3.5%', '4%', '4%']]
    solution: |
      5-year price: $50 \times 4.451822 + 1{,}000 \times 0.821927 = 1{,}044.52$ euros. 3-year price: $50/1.03 + 50/1.035^2 + 1{,}050/1.04^3 = 48.54 + 46.68 + 933.45 = 1{,}028.67$ euros.
      $f_{1,\,2} = 1.071225/1.03 - 1 = 0.0400$ and $f_{2,\,3} = 1.124864/1.071225 - 1 = 0.0501$.

  - titre: "Your turn to code"
    intro: "Write the body of the three functions, without AI. All the tests must pass."
    tests:
      - {nom: 'Price of €1,044.52 at 4%'}
      - {nom: 'At par when coupon = yield'}
      - {nom: 'The price falls when the rate rises'}
      - {nom: 'Price of €1,028.67 with the spot curve'}
      - {nom: 'Forward rates 3%, 4.0024%, 5.0073%'}
      - {nom: 'Flat curve: constant forward rates'}

  - titre: "Vocabulary"
    intro: "Tap a card: the French term and a job-interview sentence."

fiche:
  vue_ensemble:
    question: "How do we move from bond pricing to a consistent reading of the yield curve and rate sensitivity?"
    pourquoi: "Bonds are central to investing, valuing obligations and measuring interest-rate risk. A single yield summarizes cash flows, while a spot curve discounts them by maturity."
    objectifs:
      - "Price a coupon bond from its yield to maturity."
      - "Interpret premium, discount and par pricing."
      - "Distinguish yield to maturity from spot rates."
      - "Derive forward rates from spot rates under a stated compounding convention."
      - "Calculate Macaulay duration, modified duration and convexity and interpret their approximations."
      - "Identify key bond risks and limitations."
    prerequis:
      - "Present value of an annuity and a single cash flow."
      - "Compound accumulation and effective rates."
      - "Derivatives and discounted cash-flow sums."
    carte:
      - "Price: present value of coupons and redemption."
      - "YTM: the single rate reproducing the price, under contractual cash-flow assumptions."
      - "Spot: maturity-specific rate used to discount a cash flow."
      - "Forward: implied rate between future dates."
      - "Duration and convexity: sensitivity measures."
  cours_complet:
    sections:
      - titre: "1. Coupon bond pricing"
        contenu: "A standard bond pays coupon c on scheduled dates and repays face value F at maturity n. Its price is the present value of contractual cash flows. With constant annual coupons and an annual effective yield y, it is a coupon annuity plus discounted redemption. Yield to maturity (YTM) is the rate solving this equation from the observed price; it assumes, among other things, that cash flows are paid and that rate conventions and dates are consistent."
        formules:
          - {explication: "Price of a bond with constant annual coupon and redemption of face value at maturity."}
          - {explication: "The cash coupon c equals face value F times coupon rate q."}
          - {explication: "Identity linking premium to the difference between the cash coupon and interest at the yield."}
      - titre: "2. Premium, discount and par"
        contenu: "The bond trades at par when the cash coupon equals the required yield. If the coupon exceeds the yield, it is worth more than face value and trades at a premium. If the coupon is below the yield, it trades at a discount. With fixed cash flows, price decreases as yield rises; as maturity approaches, price tends towards redemption, provided cash flows are paid and there is no default or embedded option."
        formules:
          - {explication: "Compare coupon rate q and yield y for a standard bond."}
          - {explication: "For fixed positive cash flows, a higher yield reduces price."}
      - titre: "3. YTM, spot rates and clean/dirty price"
        contenu: "YTM is one rate that reproduces a bond's price from its cash flows. Spot rates apply to zero-coupon cash flows at each maturity and allow curve-consistent valuation. A spot-discounted price is the theoretical value on the curve. In markets, the quoted clean price generally excludes accrued coupon, while the dirty price paid includes it. Accrued coupon depends on the day-count convention, coupon dates and market; no universal convention is assumed here."
        formules:
          - {explication: "Discount each cash flow at the spot rate for its payment date, using annual effective compounding."}
          - {explication: "Usual relation between dirty and clean prices; CC is accrued coupon under the market convention."}
      - titre: "4. Spot curve and forward rates"
        contenu: "A spot curve is a set of zero-coupon rates by maturity. Under annual effective compounding and no-arbitrage, investing for two years must equal investing for one year and reinvesting for another year at the implied forward rate. A forward is implied mathematically by the curve, not necessarily a forecast of the future rate. Rates may be interpolated for missing maturities, but the interpolation method must be stated."
        formules:
          - {explication: "Equivalence between two-year investment and a one-year investment followed by a forward rate."}
          - {explication: "One-year forward rate between t−1 and t, with s_0=0."}
          - {explication: "Bond valuation using the spot curve, rather than a single YTM."}
      - titre: "5. Macaulay and modified duration"
        contenu: "Macaulay duration is the weighted average payment date, with weights equal to present values of cash flows divided by price. It is measured in years for annual cash flows. Modified duration approximates relative price change for a small YTM change, under annual effective compounding and fixed cash flows. For m-times-per-year compounding, the formula must be adjusted to the convention."
        formules:
          - {explication: "Weighted average of cash-flow dates by present value."}
          - {explication: "Modified duration for annual effective yield and annual compounding."}
          - {explication: "First-order approximation: modified duration only, for a small yield change."}
      - titre: "6. Convexity and price-yield approximation"
        contenu: "Convexity measures curvature of price with respect to yield. For a standard bond with positive cash flows, price is convex: duration-only approximation generally understates the gain when yield falls and overstates the loss when yield rises, for sufficiently small and comparable changes. Duration and convexity do not replace exact repricing; they are local approximations."
        formules:
          - {explication: "Conventional convexity under annual effective compounding and fixed cash flows."}
          - {explication: "Second-order approximation; yield change is expressed as a decimal."}
      - titre: "7. Risks, conventions and limitations"
        contenu: "A bond can face interest-rate, credit/default, liquidity, reinvestment, inflation, currency and model risks. Callable or convertible bonds have option-driven cash flows: duration and convexity may differ, and convexity can be negative in some regions. A spot curve must be built from consistent instruments and conventions; rates may not be observable at every maturity. YTM is not a guaranteed realized return: the outcome depends on resale price, default and coupon reinvestment. This reference assumes annual coupons, effective rates, deterministic cash flows and no options, taxes or fees."
        formules:
          - {formule: "\\text{Realized return}\\ne\\text{Guaranteed YTM}", explication: "YTM is a valuation measure under assumptions, not a promise of realized return."}
  methodes:
    methodes:
      - titre: "Price at YTM"
        quand_utiliser: "A bond price or yield is required for known contractual cash flows."
        etapes:
          - "Draw coupons and redemption on a timeline."
          - "Identify cash coupon, frequency, maturity and YTM."
          - "Check that rate and frequency are consistent."
          - "Discount each cash flow or use the annuity formula."
          - "Compare price with face value and interpret premium/discount."
        controles:
          - "When coupon equals YTM, price should equal par."
          - "Price should fall as YTM rises for fixed positive cash flows."
          - "Discounted cash flows should sum to the price."
        erreurs:
          - "Confusing coupon rate with YTM."
          - "Discounting coupons at the wrong period count."
          - "Forgetting redemption of face value."
      - titre: "Build a spot-curve price"
        quand_utiliser: "A spot curve is supplied and cash flows have different maturities."
        etapes:
          - "List cash flows C_t and their payment dates."
          - "Match each cash flow to its spot rate s_t."
          - "Discount each flow using its own rate and maturity."
          - "Sum present values."
          - "Optionally compare with a YTM price and explain the difference."
        controles:
          - "Each spot rate must match the cash-flow maturity."
          - "Curve and compounding conventions must be consistent."
          - "Present values must sum to the theoretical price."
        erreurs:
          - "Using the final-maturity spot rate for every cash flow."
          - "Confusing spot rate with YTM."
          - "Averaging rates without a weighting or model."
      - titre: "Measure sensitivity"
        quand_utiliser: "Compare bond sensitivities or approximate a yield shock."
        etapes:
          - "Calculate price at the base yield."
          - "Calculate cash-flow present values and weights."
          - "Calculate Macaulay duration, then modified duration."
          - "Calculate convexity under the stated convention."
          - "Approximate post-shock price and compare with exact repricing."
        controles:
          - "Macaulay duration lies between first and last payment dates for positive cash flows."
          - "Modified duration is below Macaulay when y>0."
          - "Convexity is positive for a standard fixed-cash-flow bond."
        erreurs:
          - "Confusing years with percentage price change."
          - "Entering 1 instead of 0.01 for a 1% shock."
          - "Ignoring convexity or applying it to large shocks without checking."
  exemples_guides:
    exemples:
      - titre: "Price, premium and discount"
        enonce: "Synthetic bond: face value 1,000, annual coupon 5%, maturity 5 years. Calculate price for YTM 4%, 5% and 6%."
        raisonnement:
          - "Coupons of 50 at years 1 to 5 and redemption of 1,000 at year 5."
          - "At 4%, P≈1,044.52: premium."
          - "At 5%, P=1,000: par."
          - "At 6%, P≈957.88: discount."
        resultat: "P(4 %)≈1,044.52; P(5 %)=1,000; P(6 %)≈957.88."
        interpretation: "Price moves inversely to required yield because contractual cash flows remain fixed."
        controles:
          - "Recalculate by discounting coupons and redemption."
          - "At 5%, price must equal face value to numerical precision."
      - titre: "Spot-curve price and forward rates"
        enonce: "Synthetic spot curve s_1=3 %, s_2=3.5 %, s_3=4 %. Price a 3-year bond with face value 1,000 and coupon 5%; also calculate the forward rates from year 1 to 2, then 2 to 3."
        raisonnement:
          - "P=50/1.03+50/1.035²+1,050/1.04³."
          - "Forward rates follow from accumulation-factor equivalence."
          - "f_{1→2}=(1.035²/1.03)−1≈4.0024 %."
          - "f_{2→3}=(1.04³/1.035²)−1≈5.0073 %."
        resultat: "Price≈1,028.67; f_{1→2}≈4.0024 %; f_{2→3}≈5.0073 %."
        interpretation: "Spot valuation discounts each coupon at its own rate; forwards are implied rates, not guaranteed forecasts."
        controles:
          - "Check each PV individually."
          - "Compare with a YTM price at approximately 3.9677 %."
      - titre: "Duration and convexity"
        enonce: "For the 5-year bond with face value 1,000, coupon 5%, and YTM 4%, calculate sensitivity measures."
        raisonnement:
          - "Price≈1,044.5182."
          - "Macaulay duration≈4.5571 years; modified duration≈4.3818."
          - "Conventional convexity≈24.4766."
          - "For a +1 percentage-point yield shock, the second-order approximation gives a relative change of about −4.2594 %."
        resultat: "D_Mac≈4.5571; D_mod≈4.3818; Conv≈24.4766."
        interpretation: "Duration measures local sensitivity; convexity adjusts for curvature. Exact repricing is preferable for a material shock."
        controles:
          - "Compare the approximation with P(5 %)−P(4 %)."
          - "PV weights should sum to 1."
  exercices_corriges:
    exercices:
      - titre: "Fundamental — premium or discount"
        enonce: "Face value 1,000, coupon 4%, maturity 4 years, YTM 5%. Is it at par, premium or discount?"
        corrige:
          - "Cash coupon is 40 and required yield is 5%."
          - "Coupon is below yield: the bond trades at a discount."
          - "P=40 a_4|5%+1,000 v_5%^4≈964.54."
        feedback: "Compare the cash coupon with the required yield before calculating price."
      - titre: "Intermediate — spot versus YTM"
        enonce: "A 3-year bond, face value 1,000, coupon 5%, is valued with s_1=3 %, s_2=3.5 %, s_3=4 %. Calculate its price and explain why its YTM is not necessarily 4%."
        corrige:
          - "Discount 50 at year 1 with 3%, 50 at year 2 with 3.5%, and 1,050 at year 3 with 4%."
          - "P≈1,028.67."
          - "The single YTM reproducing this price is approximately 3.9677%; coupons affect the rate."
        feedback: "Spot rates are maturity-specific; YTM is a single rate summarizing all cash flows."
      - titre: "Advanced — duration and shock"
        enonce: "At YTM 4%, estimate the price change when yield rises by 0.5 percentage points. Use modified duration 4.3818 and convexity 24.4766."
        corrige:
          - "Δy=0.005."
          - "Approximation: −4.3818×0.005+0.5×24.4766×0.005²≈−2.1603 %."
          - "Duration alone gives about −2.1909%; convexity moderates the decline."
        feedback: "Express the shock as a decimal. Convexity is multiplied by the squared shock and by one half."
  applications_labs:
    applications:
      - titre: "Spot-curve, pricing and sensitivity lab"
        contexte: "Synthetic curve and bond for illustration, not market data."
        objectif: "Compare YTM pricing, spot pricing, forwards and sensitivity approximations."
        entrees:
          - "Face value 1,000, annual coupon 5%, maturity 5 years."
          - "Base YTM 4%, then shocks −1, +0.5 and +1 percentage points."
          - "Illustrative spot curve: 3%, 3.5%, 4%, 4.25%, 4.5%."
        hypotheses:
          - "Annual coupons, annual effective compounding, fixed cash flows."
          - "Synthetic curve; no default, options, taxes or fees."
        procedure:
          - "Create annual cash flows 50, 50, 50, 50, 1,050."
          - "Calculate YTM price from discounted cash flows."
          - "Discount each cash flow using its spot rate."
          - "Derive annual forwards from spot accumulation factors."
          - "Calculate duration, convexity and approximate price change."
          - |
            ```python
            face, coupon, n, y = 1000.0, 0.05, 5, 0.04
            cash = [face * coupon] * (n - 1) + [face * (1 + coupon)]
            pv = [cf / (1 + y) ** t for t, cf in enumerate(cash, 1)]
            price = sum(pv)
            macaulay = sum(t * x for t, x in enumerate(pv, 1)) / price
            modified = macaulay / (1 + y)
            convexity = sum(t * (t + 1) * x for t, x in enumerate(pv, 1)) / price / (1 + y) ** 2
            spot = [0.03, 0.035, 0.04, 0.0425, 0.045]
            spot_price = sum(cf / (1 + s) ** t for t, (cf, s) in enumerate(zip(cash, spot), 1))
            forwards = [spot[0]] + [(1 + spot[t]) ** (t + 1) / (1 + spot[t - 1]) ** t - 1 for t in range(1, len(spot))]
            shock = 0.005
            approx_change = -modified * shock + 0.5 * convexity * shock ** 2
            exact_change = sum(cf / (1 + y + shock) ** t for t, cf in enumerate(cash, 1)) / price - 1
            print(price, spot_price, macaulay, modified, convexity, approx_change, exact_change)
            ```
        sorties:
          - "YTM price and spot price."
          - "Implied forward rates."
          - "Duration, convexity, approximate and exact changes."
        validation:
          - "YTM price equals the sum of discounted cash flows."
          - "Spot price uses the rate for each maturity."
          - "Forward rates satisfy accumulation-factor equivalence."
          - "Approximation is close to exact repricing for a small shock."
        limites:
          - "The curve and cash flows are synthetic and deterministic."
          - "Annual convention; do not transfer directly to other market conventions."
  synthese_references:
    memo:
      - "Bond price: PV of coupons and face value; YTM is the single rate reproducing the price."
      - "Coupon above YTM: premium; below: discount; equal: par."
      - "Spot discounts each cash flow by maturity; YTM does not replace the curve."
      - "Forward: implied no-arbitrage rate under a convention, not a forecast."
      - "Modified duration approximates relative price change; convexity adds curvature."
      - "Exact repricing, credit, liquidity, options and conventions still matter."
    liens:
      - {titre: "A1/S04 — Loans and amortization"}
    references:
      - {titre: "Kellison — The Theory of Interest", detail: "Chapters on bonds, term structure and sensitivity measures."}
      - {titre: "Tuckman and Serrat — Fixed Income Securities", detail: "Bond valuation, yield curves, forward rates, duration and convexity."}
      - {titre: "Society of Actuaries — Financial Mathematics (FM)", detail: "Financial mathematics syllabus and bond concepts."}
    glossaire:
      - {definition: "Debt security with contractual cash flows and redemption according to its terms."}
      - {definition: "Periodic interest payment specified by the bond contract."}
      - {definition: "Reference amount generally repaid at maturity."}
      - {definition: "Single rate reproducing the price from contractual cash flows."}
      - {definition: "Zero-coupon rate associated with a maturity, used to discount one cash flow."}
      - {definition: "Implied rate between future dates derived from the spot curve."}
      - {definition: "PV-weighted average of payment dates."}
      - {definition: "Approximate relative price sensitivity to yield for a small change."}
      - {definition: "Measure of price curvature with respect to yield."}
      - {definition: "Quoted price excluding accrued coupon and paid price including accrued coupon."}
    maitrise:
      - "I can price a bond and explain premium, discount or par."
      - "I can distinguish YTM from spot rates and value cash flows using the curve."
      - "I can derive a forward rate under annual compounding."
      - "I can interpret duration, convexity and their limits."
      - "I can name the main risks and conventions of a bond."
