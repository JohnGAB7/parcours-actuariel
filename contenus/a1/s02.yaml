      - {nom: '6 % mensuel vaut 6,1678 % effectif', expr: "abs(effective_rate(0.06, 12) - 0.0616778) < 1e-7"}
      - {nom: 'Aller-retour : effectif, puis nominal, puis effectif', expr: "abs(effective_rate(nominal_rate(0.07, 4), 4) - 0.07) < 1e-12"}
      - {nom: '$a^{(12)}_{\overline{10}|}$ vaut 8,25854 à 4 %', expr: "abs(annuity_mthly(10, 0.04, 12) - 8.25854) < 0.00001"}
      - {nom: '$\ddot{a}^{(12)}_{\overline{10}|}$ vaut 8,28558 à 4 %', expr: "abs(annuity_mthly(10, 0.04, 12, due=True) - 8.28558) < 0.00001"}
      - {nom: 'Avec $m = 1$, on retrouve $a_{\overline{10}|} = 8{,}11090$', expr: "abs(annuity_mthly(10, 0.04, 1) - 8.11090) < 0.00001"}

