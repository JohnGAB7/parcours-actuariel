  - type: rappel
    titre: "Le rappel"
    minutes: 8
    blocs:
      - p: >-
          Placé au <b>taux d'intérêt effectif annuel</b> <i>(annual effective interest rate)</i> $i$, un capital de 1
          devient $(1+i)^t$ après $t$ années : c'est l'<b>intérêt composé</b> <i>(compound interest)</i>. À l'inverse,
          le <b>facteur d'actualisation</b> <i>(discount factor)</i> $v$ ramène un montant futur à aujourd'hui.
      - formule: |
          \begin{gathered}
          v = \frac{1}{1+i} \qquad d = \frac{i}{1+i} = i\,v \qquad \delta = \ln(1+i) \\[6pt]
          (1+i)^t = e^{\delta t}
          \end{gathered}
      - p: >-
          $d$ est le <b>taux d'escompte</b> <i>(rate of discount)</i>, l'intérêt payé en début d'année. $\delta$ est la
          <b>force d'intérêt</b> <i>(force of interest)</i>, l'équivalent continu du taux. C'est le pendant financier de
          la force de mortalité que tu verras en A3.
      - p: >-
          Une <b>annuité certaine</b> <i>(annuity certain)</i> verse 1 chaque année pendant $n$ ans, sans condition de
          survie. Si le paiement tombe en fin d'année, l'annuité est <b>immédiate</b> <i>(annuity immediate)</i>.
          S'il tombe en début d'année, elle est <b>due</b> <i>(annuity due)</i>.
      - formule: |
          \begin{gathered}
          a_{\overline{n}|} = \sum_{k=1}^{n} v^k = \frac{1 - v^n}{i} \\[6pt]
          \ddot{a}_{\overline{n}|} = \sum_{k=0}^{n-1} v^k = \frac{1 - v^n}{d} = (1+i)\,a_{\overline{n}|}
          \end{gathered}
      - p: >-
          Plus généralement, la <b>valeur actuelle</b> <i>(present value)</i> d'une suite de flux $C_t$ est la somme
          des flux actualisés. Tout le reste du parcours, des rentes viagères aux provisions, repose sur cette somme.
      - formule: |
          \text{VA} = \sum_t C_t\, v^t
      - note: >-
          En A3, une rente viagère sera une annuité certaine dont chaque paiement est multiplié par une
          probabilité de survie : $\ddot{a}_x = \sum_k v^k\,{}_kp_x$.
      - sources:
          - {titre: "Kellison, The Theory of Interest, chap. 1 à 3", detail: "Intérêt composé, taux équivalents, annuités certaines"}
          - {titre: "SOA, Financial Mathematics (FM) Exam", url: "https://www.soa.org/education/exam-req/edu-exam-fm-detail/", detail: "Syllabus officiel de l'examen"}

  - type: quiz
    titre: "Vérifie"
    minutes: 4
    intro: "Quatre questions. Réponds sans relire le rappel."
    questions:
      - q: 'À 2,5 %, combien vaut aujourd''hui 1 000 € payés dans 10 ans, environ ?'
        options: ['781 €', '975 €', '1 280 €']
        reponse: 0
        pourquoi:
          rappel: >-
            Actualiser, c'est diviser par le facteur d'accumulation $(1+i)^t$, donc multiplier par $v^t$.
          formule: |-
            \text{VA} = C\,v^t = \frac{C}{(1+i)^t}
          exemple: >-
            $1{,}025^{10} = 1{,}28008$, donc $1\,000 / 1{,}28008 = 781{,}20$ €.
          piege: >-
            1 280 € est la valeur accumulée (accumulated value) de 1 000 € placés 10 ans, c'est le sens inverse. 975 € n'actualise que sur un an.
      - q: 'Si le taux monte, $a_{\overline{n}|}$…'
        options: ['augmente', 'diminue', 'ne change pas']
        reponse: 1
        pourquoi:
          rappel: >-
            Chaque terme $v^k = (1+i)^{-k}$ décroît quand $i$ augmente, et les termes lointains baissent le plus.
          formule: |-
            \frac{\partial a_{\overline{n}|}}{\partial i} = -\sum_{k=1}^{n} k\,v^{k+1} < 0
          exemple: >-
            $a_{\overline{10}|}$ vaut 8,7521 à 2,5 % et 8,1109 à 4 %.
          piege: >-
            La dérivée pondère chaque flux par sa date $k$ : c'est l'idée de la duration, la sensibilité au taux. Tu la retrouveras en gestion actif-passif (asset-liability management, ALM).
      - q: 'Pourquoi $d < i$ ?'
        options: ['Parce que $d$ est payé en début d''année, sur un capital actualisé', 'Parce que $d$ est un taux continu', 'Ce n''est pas le cas']
        reponse: 0
        pourquoi:
          rappel: >-
            $d$ et $i$ décrivent le même intérêt, à deux dates. $i$ est payé en fin d'année ; $d$ est payé en début d'année, donc actualisé d'un an.
          formule: |-
            d = i\,v = \frac{i}{1+i} < i \quad (i > 0)
          exemple: >-
            100 € prêtés à 2,5 % rapportent 2,50 € en fin d'année, soit $2{,}50 \times v = 2{,}44$ € payés d'avance. Donc $d = 2{,}44\,\%$.
          piege: >-
            Le taux continu est $\delta$, pas $d$. L'ordre est toujours $d < \delta < i$.
      - q: 'Quelle formule donne $a_{\overline{n}|}$ ?'
        options: ['$\dfrac{1 - v^n}{i}$', '$\dfrac{1 - v^n}{d}$', '$\dfrac{(1+i)^n - 1}{i}$']
        reponse: 0
        pourquoi:
          rappel: >-
            On somme une suite géométrique de raison $v$ : $\sum_{k=1}^{n} v^k = v\,\frac{1 - v^n}{1 - v}$, et $\frac{v}{1-v} = \frac{1}{i}$.
          formule: |-
            \begin{gathered} a_{\overline{n}|} = \frac{1 - v^n}{i} \qquad \ddot{a}_{\overline{n}|} = \frac{1 - v^n}{d} \\[4pt] s_{\overline{n}|} = (1+i)^n\,a_{\overline{n}|} = \frac{(1+i)^n - 1}{i} \end{gathered}
          exemple: >-
            À 2,5 % sur 3 ans : $v^3 = 0{,}928599$, donc $a_{\overline{3}|} = 0{,}071401 / 0{,}025 = 2{,}8560$.
          piege: >-
            Diviser par $d$ donne l'annuité due. $s_{\overline{n}|}$ est la valeur accumulée au temps $n$, pas la valeur actuelle.

  - type: calcul
    titre: "À la main"
    minutes: 5
    intro: "Taux de 2,5 %. Calcule avec une calculatrice, puis saisis tes résultats à 4 décimales."
    donnees:
      entetes: ['$i$', '$n$']
      lignes: [['2,5 %', '3']]
    champs:
      - {cle: d, libelle: '$d$', valeur: 0.0243902, tolerance: 0.00015}
      - {cle: delta, libelle: '$\delta$', valeur: 0.0246926, tolerance: 0.00015}
      - {cle: a, libelle: '$a_{\overline{3}|}$', valeur: 2.8560236, tolerance: 0.00015}
      - {cle: ad, libelle: '$\ddot{a}_{\overline{3}|}$', valeur: 2.9274242, tolerance: 0.00015}
    solution: |
      $v = 1/1{,}025 = 0{,}975610$, $\quad d = 0{,}025 \times v = 0{,}0244$, $\quad \delta = \ln 1{,}025 = 0{,}0247$.
      $a_{\overline{3}|} = v + v^2 + v^3 = 2{,}8560$, $\quad \ddot{a}_{\overline{3}|} = 1 + v + v^2 = 2{,}9274 = 1{,}025 \times 2{,}8560$.

