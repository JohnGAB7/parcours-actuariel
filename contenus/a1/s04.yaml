# Séance 4 du module A1 (Mathématiques financières) : amortissement d'un prêt et taux de rendement interne.
# Chiffres : prêt fictif de 10 000 € à 6 % sur 5 ans. Les valeurs sont recalculées par tests/test_contenus.py et tests/a1/test_s04_prets.py.
id: a1/s04
module: a1
titre: "Prêts, amortissement et taux de rendement"
en: "Loans, amortization and yield rates"
duree: 45
taux: 0.06

actu_basics:
  episode: "A1 · Financial mathematics"
  statut: "à proposer"
  accroche_fr: "Dans un paiement de crédit, quelle part rembourse réellement le capital ?"
  accroche_en: "In each loan payment, how much actually repays the principal?"

fiche:
  statut: prete
  vue_ensemble:
    question: "Comment décomposer un remboursement, calculer le solde restant dû et comparer des taux de rendement ?"
    pourquoi: "L'amortissement transforme un emprunt en flux périodiques. Comprendre la composition d'un paiement, le solde et les méthodes de valorisation est essentiel en crédit, assurance, retraite et analyse d'investissement."
    objectifs:
      - "Calculer un paiement constant à partir du montant emprunté, du taux et de la durée."
      - "Construire et interpréter un tableau d'amortissement."
      - "Calculer le solde restant dû par les méthodes prospective et rétrospective."
      - "Distinguer amortissement constant et annuité constante."
      - "Définir la VAN et le taux de rendement interne, et connaître leurs limites."
    prerequis:
      - "Valeur actuelle d'une annuité immédiate."
      - "Capitalisation et actualisation à taux effectif périodique."
      - "Équation de valeur et convention de signe des flux."
    carte:
      - "Paiement : intérêts de la période + remboursement de capital."
      - "Solde : capital non encore remboursé après une échéance."
      - "Amortissement : répartition du remboursement au fil du temps."
      - "VAN : somme des flux actualisés au taux de décision."
      - "TRI : taux qui annule la VAN, sous réserve de l'existence et de l'unicité d'une solution."
    duree_minutes: 45
  cours_complet:
    sections:
      - titre: "1. Équation de valeur et annuité constante"
        contenu: "Un emprunt L reçu à la date 0 et remboursé par n paiements P en fin de période au taux effectif i est valorisé à la date 0. La valeur actuelle des paiements doit égaler le montant prêté. Pour i>0, le paiement est positif et constant. Si i=0, le capital est simplement réparti sur n paiements."
        formules:
          - formule: "L=P a_{\\overline{n}|}=P\\frac{1-(1+i)^{-n}}{i}"
            explication: "Équation de valeur pour les paiements aux dates 1,…,n."
          - formule: "P=\\frac{Li}{1-(1+i)^{-n}},\\quad i>0"
            explication: "Paiement périodique constant. Cas i=0 : P=L/n."
      - titre: "2. Décomposition du paiement et récurrence du solde"
        contenu: "À la période k, les intérêts I_k sont calculés sur le solde au début de période B_{k-1}. Le paiement P couvre ces intérêts, puis le montant restant rembourse le principal. Le solde après paiement est le solde précédent diminué du remboursement de capital. Pour i≥0, un prêt amorti à paiements constants a des intérêts décroissants et des remboursements de capital croissants."
        formules:
          - formule: "I_k=iB_{k-1},\\quad PR_k=P-I_k"
            explication: "Intérêts de la période et remboursement de principal (PR)."
          - formule: "B_k=B_{k-1}-PR_k=(1+i)B_{k-1}-P"
            explication: "Récurrence du solde après l'échéance k, avec B_0=L."
          - formule: "PR_k=Pv^{n-k+1},\\quad i>0"
            explication: "Pour une annuité constante, la part de principal augmente géométriquement au facteur 1+i."
      - titre: "3. Solde restant dû — méthode prospective"
        contenu: "La méthode prospective (prospective method) valorise les paiements restant à effectuer à la date du solde. Après k paiements, il reste n−k paiements, aux dates k+1,…,n. Leur valeur actuelle à la date k est le solde. À k=n, il ne reste aucun paiement et le solde est nul."
        formules:
          - formule: "B_k=P a_{\\overline{n-k}|},\\quad 0\\le k\\le n"
            explication: "Valeur à la date k des paiements futurs. On définit a_0=0."
      - titre: "4. Solde restant dû — méthode rétrospective"
        contenu: "La méthode rétrospective (retrospective method) capitalise l'emprunt initial jusqu'à la date k, puis retranche la valeur accumulée des paiements déjà versés. Elle donne le même solde que la méthode prospective lorsque les flux suivent le contrat et utilisent le même taux."
        formules:
          - formule: "B_k=L(1+i)^k-Ps_{\\overline{k}|}"
            explication: "Solde rétrospectif après k paiements, avec s_0=0."
          - formule: "s_{\\overline{k}|}=\\frac{(1+i)^k-1}{i},\\quad i>0"
            explication: "Valeur accumulée d'une annuité immédiate unitaire; si i=0, s_k=k."
      - titre: "5. Amortissement constant"
        contenu: "Dans un plan à amortissement constant, le principal remboursé A est identique chaque période : A=L/n. Le solde décroît linéairement. Les intérêts diminuent avec le solde : les paiements totaux diminuent si i>0 et restent constants si i=0. Ce plan est différent d'un prêt à annuités constantes, où le paiement total P est fixe."
        formules:
          - formule: "A=\\frac{L}{n},\\quad B_k=L-kA"
            explication: "Principal constant et solde après k échéances."
          - formule: "P_k=A+iB_{k-1}"
            explication: "Paiement total à la période k : amortissement plus intérêts."
      - titre: "6. VAN et taux de rendement interne"
        contenu: "Pour un projet, la valeur actuelle nette (VAN/NPV) actualise les flux C_t à un taux de décision j. Le taux de rendement interne (TRI/IRR) est un taux j qui annule cette VAN. La VAN permet de comparer la valeur créée à un taux cohérent avec le risque; le TRI résume un taux de rendement mais peut être ambigu si les flux changent de signe plusieurs fois. Il peut exister plusieurs TRI ou aucun TRI réel dans le domaine considéré. Pour des projets mutuellement exclusifs, le TRI peut aussi conduire à un classement différent de celui fondé sur la VAN."
        formules:
          - formule: "\\operatorname{VAN}(j)=\\sum_{t=0}^{m}\\frac{C_t}{(1+j)^t}"
            explication: "VAN des flux datés aux périodes t, avec j>-1 pour les puissances réelles."
          - formule: "\\operatorname{TRI}:\\quad \\operatorname{VAN}(j)=0"
            explication: "Un taux interne est une racine de l'équation de VAN; l'existence et l'unicité ne sont pas garanties."
      - titre: "7. Hypothèses, conventions et cas limites"
        contenu: "Les formules d'annuité supposent des échéances régulières en fin de période, un taux effectif cohérent avec cette période et un paiement constant. Un taux nominal doit être converti en taux effectif périodique. Pour i=0, P=L/n, le solde B_k=L(1−k/n) et les intérêts sont nuls. En pratique, les arrondis au centime peuvent créer un petit solde final : l'échéance finale est parfois ajustée. Les frais, assurance emprunteur, dates irrégulières, taux variables, pénalités et fiscalité ne sont pas inclus. Le TRI d'un flux conventionnel (un décaissement initial puis des encaissements) est généralement unique au-dessus de −100 %, mais cette propriété ne s'étend pas à des flux non conventionnels."
        formules:
          - formule: "i=0:\\quad P=\\frac{L}{n},\\quad B_k=L\\left(1-\\frac{k}{n}\\right)"
            explication: "Cas sans intérêts : le principal est remboursé en parts égales."
  methodes:
    methodes:
      - titre: "Calculer un paiement constant"
        quand_utiliser: "Un emprunt est remboursé par n échéances identiques, en fin de période."
        etapes:
          - "Définir le montant emprunté L, le taux effectif périodique i et le nombre d'échéances n."
          - "Vérifier que taux et période de paiement sont cohérents."
          - "Calculer a_{n|}, puis P=L/a_{n|}."
          - "Contrôler que la valeur actuelle des n paiements est égale à L."
        controles:
          - "Pour i>0, P est supérieur à L/n."
          - "Le paiement est constant; la part d'intérêts décroît lorsque le solde baisse."
          - "Le solde après la dernière échéance doit être nul, à l'effet des arrondis près."
        erreurs:
          - "Utiliser un taux annuel pour des paiements mensuels sans conversion."
          - "Confondre paiement total et remboursement de principal."
          - "Arrondir chaque étape trop tôt."
      - titre: "Construire un tableau d'amortissement"
        quand_utiliser: "Il faut détailler, période par période, le paiement, les intérêts, le principal et le solde."
        etapes:
          - "Initialiser B_0=L."
          - "Calculer I_k=iB_{k-1}."
          - "Calculer PR_k=P-I_k."
          - "Calculer B_k=B_{k-1}-PR_k."
          - "Vérifier la somme des remboursements de principal et le solde final."
        controles:
          - "I_k+PR_k=P."
          - "B_k=B_{k-1}-PR_k."
          - "La somme des PR_k doit égaler L."
          - "Le solde doit décroître pour un prêt amorti à taux non négatif."
        erreurs:
          - "Calculer les intérêts sur le solde après paiement."
          - "Soustraire le paiement entier du solde."
          - "Confondre B_k et B_{k-1}."
      - titre: "Calculer et interpréter un TRI"
        quand_utiliser: "Les flux d'un projet sont datés et un taux interne est demandé."
        etapes:
          - "Fixer la convention de signe : investissement initial négatif, recettes positives."
          - "Écrire la VAN comme fonction du taux j."
          - "Chercher une racine de VAN(j)=0 et vérifier le résidu."
          - "Inspecter les changements de signe des flux et les éventuelles racines multiples."
          - "Comparer le TRI au taux de décision, puis compléter l'analyse par la VAN."
        controles:
          - "La VAN au TRI doit être proche de zéro."
          - "Comparer VAN et TRI sur le même calendrier de flux."
          - "Ne pas présenter un TRI trouvé numériquement comme unique sans vérification."
        erreurs:
          - "Confondre TRI et taux d'actualisation de décision."
          - "Utiliser un TRI comme unique critère pour des projets de tailles ou calendriers différents."
          - "Ignorer les flux non conventionnels et les racines multiples."
  exemples_guides:
    exemples:
      - titre: "1. Annuité et première échéance"
        enonce: "Emprunt de 10 000 € au taux effectif annuel de 6 %, remboursé en 5 annuités en fin d'année."
        raisonnement:
          - "Calculer a_{5|}=(1−1,06^{-5})/0,06≈4,212364."
          - "P=10 000/4,212364≈2 373,96 €."
          - "À la première échéance, I_1=0,06×10 000=600 €."
          - "PR_1=2 373,96−600≈1 773,96 €; B_1≈8 226,04 €."
        resultat: "Annuité ≈ 2 373,96 €; solde après la première échéance ≈ 8 226,04 €."
        interpretation: "Le premier paiement contient 600 € d'intérêts et le reste rembourse le capital. Les intérêts diminueront à mesure que le solde baisse."
        controles:
          - "La valeur actuelle des cinq paiements égale environ 10 000 €."
          - "Le paiement dépasse 10 000/5=2 000 €, car il inclut des intérêts."
      - titre: "2. Solde après deux paiements — deux méthodes"
        enonce: "Pour le même emprunt, calculer B_2 après deux annuités."
        raisonnement:
          - "Prospective : il reste trois paiements, donc B_2=P a_{3|}≈2 373,96×2,673012."
          - "Rétrospective : capitaliser 10 000 € pendant deux ans et retrancher la valeur accumulée des deux paiements."
          - "Les deux méthodes donnent environ 6 345,63 € (les écarts éventuels proviennent de l'arrondi des paiements affichés)."
        resultat: "B_2≈6 345,63 €."
        interpretation: "Le solde est la valeur du contrat à la date 2, pas simplement L−2P : les intérêts doivent être pris en compte."
        controles:
          - "B_2 est inférieur à B_1 et supérieur à zéro."
          - "Les deux méthodes doivent coïncider avec des valeurs non arrondies."
      - titre: "3. VAN et TRI d'un projet simple"
        enonce: "Investir 1 000 € aujourd'hui et recevoir 600 € à la fin de l'année 1 puis 600 € à la fin de l'année 2."
        raisonnement:
          - "VAN(j)=−1 000+600/(1+j)+600/(1+j)^2."
          - "Le TRI est la racine de la VAN(j)=0."
          - "Le TRI numérique est environ 13,0662 %."
          - "À un taux de décision de 10 %, la VAN est positive : environ 41,32 €."
        resultat: "TRI≈13,0662 %; VAN à 10 %≈41,32 €."
        interpretation: "Le projet a une VAN positive au taux de 10 % dans ce modèle. Le TRI dépasse ce taux, mais la décision doit aussi tenir compte du risque, de la taille, du calendrier et des hypothèses."
        controles:
          - "Substituer le TRI dans l'équation donne une VAN proche de zéro."
          - "La VAN à 10 % doit être positive."
  exercices_corriges:
    exercices:
      - titre: "Paiement constant — niveau fondamental"
        niveau: fondamental
        enonce: "Emprunter 25 000 € à 3,5 % effectif annuel sur 12 ans, avec paiements annuels en fin d'année. Calculer le paiement."
        corrige:
          - "a_{12|}=(1−1,035^{-12})/0,035≈9,663."
          - "P=25 000/a_{12|}≈2 587,10 €."
        feedback: "Le paiement comprend principal et intérêts. Une durée plus longue réduit généralement le paiement, mais augmente le total des intérêts."
      - titre: "Solde — niveau intermédiaire"
        niveau: intermediaire
        enonce: "Un prêt de 10 000 € à 6 % sur 5 ans est remboursé par annuités constantes. Calculer le solde après 2 paiements."
        corrige:
          - "P≈2 373,96 €."
          - "B_2=P a_{3|}≈6 345,63 €."
          - "Vérifier avec B_2=10 000(1,06)^2−P s_{2|}."
        feedback: "Le solde prospectif actualise les paiements restant à effectuer. La méthode rétrospective doit donner le même résultat."
      - titre: "VAN et TRI — niveau intermédiaire"
        niveau: intermediaire
        enonce: "Un projet coûte 2 000 € et verse 1 200 € à la fin des années 1 et 2. Calculer la VAN à 8 % et déterminer le TRI."
        corrige:
          - "VAN(8%)=−2 000+1 200/1,08+1 200/1,08²≈139,92 €."
          - "Le TRI résout −2 000+1 200/(1+j)+1 200/(1+j)²=0."
          - "Pour deux recettes identiques, résoudre 2 000=1 200 a_{2|} : j≈13,0662 %."
        feedback: "Une VAN positive au taux de décision indique une création de valeur dans ce modèle. Le TRI est une solution de l'équation de VAN; ne pas supposer qu'il est unique pour tout calendrier de flux."
  applications_labs:
    applications:
      - titre: "Construire et auditer un échéancier de crédit"
        contexte: "Un analyste compare un crédit à annuité constante à un crédit à amortissement constant et contrôle le solde restant dû."
        objectif: "Reproduire le paiement, l'échéancier et le solde par deux méthodes indépendantes, puis vérifier les flux."
        outils: ["excel", "python"]
        entrees:
          - "Montant emprunté L"
          - "Taux effectif périodique i"
          - "Nombre de périodes n"
          - "Convention de paiement en fin de période"
        hypotheses:
          - "Taux constant et échéances régulières."
          - "Aucun frais, assurance ou paiement anticipé."
          - "Montants non arrondis dans les calculs; affichage au centime."
        procedure:
          - "Excel : utiliser PMT(rate,nper,pv) en respectant la convention de signe, puis construire le solde avec les formules intérêts, principal et solde."
          - "Python : calculer le paiement et la liste des tuples (période, intérêts, principal, solde)."
          - "Comparer le solde à la date k par méthode prospective et rétrospective."
          - |-
            Python (reproducible):
            ```python
            def level_payment(L, n, i):
                if n <= 0 or i <= -1:
                    raise ValueError('n must be positive and i > -1')
                return L / n if i == 0 else L * i / (1 - (1 + i) ** (-n))

            def amortization_schedule(L, n, i):
                P = level_payment(L, n, i)
                B, rows = L, []
                for k in range(1, n + 1):
                    interest = i * B
                    principal = P - interest
                    B -= principal
                    rows.append((k, interest, principal, B))
                return rows

            P = level_payment(10_000, 5, 0.06)
            rows = amortization_schedule(10_000, 5, 0.06)
            assert abs(P - 2_373.9640043) < 1e-6
            assert abs(rows[1][3] - 6_345.6341511) < 1e-6
            ```
          - "Tester i=0 et vérifier que le principal est remboursé en parts égales."
          - "Comparer les profils de paiements d'un amortissement constant et d'une annuité constante."
        sorties:
          - "Paiement périodique et total des intérêts."
          - "Échéancier détaillé."
          - "Solde restant dû après chaque paiement."
          - "Vérifications de cohérence."
        validation:
          - "Intérêts + remboursement de principal = paiement."
          - "Somme des remboursements de principal = montant initial."
          - "Solde final = 0 à tolérance numérique près."
          - "Solde prospectif = solde rétrospectif."
        limites:
          - "Le calendrier réel, frais, taux variables et arrondis contractuels peuvent modifier le résultat."
          - "Les conventions PMT/RATE/IRR varient selon les tableurs et locales; vérifier les signes et séparateurs."
  synthese_references:
    memo:
      - "L=P a_{n|} et P=L/a_{n|}; à taux nul, P=L/n."
      - "Paiement = intérêts iB_{k−1} + principal remboursé PR_k."
      - "B_k=P a_{n−k|} (prospective) = L(1+i)^k−P s_{k|} (rétrospective)."
      - "Amortissement constant : A=L/n; paiements totaux décroissants si i>0 et constants si i=0."
      - "VAN(j)=somme des flux actualisés; le TRI est une racine, pas nécessairement unique."
    glossaire:
      - terme_fr: "Prêt amorti"
        terme_en: "Amortized loan"
        definition: "Emprunt dont le capital est remboursé progressivement selon un échéancier."
      - terme_fr: "Solde restant dû"
        terme_en: "Outstanding balance"
        definition: "Capital restant à rembourser à une date donnée, hors frais ou intérêts futurs non échus selon la convention."
      - terme_fr: "Remboursement de principal"
        terme_en: "Principal repayment"
        definition: "Part du paiement qui réduit le capital emprunté."
      - terme_fr: "Tableau d'amortissement"
        terme_en: "Amortization schedule"
        definition: "Tableau indiquant, pour chaque échéance, paiement, intérêts, principal et solde."
      - terme_fr: "Valeur actuelle nette"
        terme_en: "Net present value (NPV)"
        definition: "Somme des flux actualisés au taux de décision."
      - terme_fr: "Taux de rendement interne"
        terme_en: "Internal rate of return (IRR)"
        definition: "Taux qui annule la VAN pour le calendrier de flux considéré."
    maitrise:
      - "Je peux calculer un paiement constant et expliquer son équation de valeur."
      - "Je peux construire et vérifier un tableau d'amortissement."
      - "Je peux calculer le solde restant dû par les deux méthodes."
      - "Je peux expliquer la différence entre annuité constante et amortissement constant."
      - "Je peux interpréter VAN et TRI et en reconnaître les limites."
    liens:
      - titre: "Annuités variables et perpétuités"
        cible: "a1/s03"
