  applications_labs:
    applications:
      - titre: "Laboratoire de courbe spot, prix et sensibilité"
        contexte: "Courbe et obligation synthétiques pour illustrer la valorisation, sans données de marché."
        objectif: "Comparer un prix YTM, un prix spot, les forwards et l'approximation de sensibilité."
        outils: [excel, python]
        entrees:
          - "Nominal 1 000, coupon annuel 5 %, maturité 5 ans."
          - "YTM de base 4 %, puis chocs −1, +0,5 et +1 point."
          - "Courbe spot illustrative : 3 %, 3,5 %, 4 %, 4,25 %, 4,5 %."
        hypotheses:
          - "Coupons annuels, capitalisation annuelle effective, flux fixes."
          - "Courbe fictive, pas de défaut, options, taxes ou frais."
        procedure:
          - "Créer les flux annuels 50, 50, 50, 50, 1 050."
          - "Calculer le prix YTM par somme de PV."
          - "Actualiser les flux à leurs taux spot pour obtenir le prix spot."
          - "Dériver les forwards annuels à partir des facteurs spot."
          - "Calculer duration, convexité et approximation du prix après choc."
          - |
            ```python
            face, coupon, n, y = 1000.0, 0.05, 5, 0.04
            cash = [face * coupon] * (n - 1) + [face * (1 + coupon)]
            pv = [cf / (1 + y) ** t for t, cf in enumerate(cash, 1)]
            price = sum(pv)
            macaulay = sum(t * x for t, x in enumerate(pv, 1)) / price
            modified = macaulay / (1 + y)
            convexity = sum(t * (t + 1) * x for t, x in enumerate(pv, 1)) / price / (1 + y) ** 2
            spot = [0.03, 0.035, 0.04, 0.0425, 0.045]
            spot_price = sum(cf / (1 + s) ** t for t, (cf, s) in enumerate(zip(cash, spot), 1))
            forwards = [spot[0]] + [(1 + spot[t]) ** (t + 1) / (1 + spot[t - 1]) ** t - 1 for t in range(1, len(spot))]
            shock = 0.005
            approx_change = -modified * shock + 0.5 * convexity * shock ** 2
            exact_change = sum(cf / (1 + y + shock) ** t for t, cf in enumerate(cash, 1)) / price - 1
            print(price, spot_price, macaulay, modified, convexity, approx_change, exact_change)
            ```
        sorties:
          - "Prix au YTM et prix spot."
          - "Taux à terme implicites."
          - "Duration, convexité, variation approximée et exacte."
        validation:
          - "Le prix YTM reproduit la somme des flux actualisés."
          - "Le prix spot utilise le taux correspondant à chaque échéance."
          - "Les forwards respectent l'équivalence de capitalisation."
          - "L'approximation se rapproche de la variation exacte pour un petit choc."
        limites:
          - "La courbe et les flux sont fictifs et déterministes."
          - "La convention est annuelle; ne pas extrapoler à des conventions de marché différentes."
