          - "Entrer 1 au lieu de 0,01 pour un choc de 1 %."
          - "Oublier le terme de convexité ou l'appliquer à de grands chocs sans contrôle."
  exemples_guides:
    exemples:
      - titre: "Prix, prime et décote"
        enonce: "Obligation fictive : nominal 1 000 €, coupon annuel 5 %, échéance 5 ans. Calculer le prix pour un YTM de 4 %, 5 % et 6 %."
        raisonnement:
          - "Coupons de 50 € aux années 1 à 5 et remboursement de 1 000 € à l'année 5."
          - "À 4 %, P≈1 044,52 € : prime."
          - "À 5 %, P=1 000 € : au pair."
          - "À 6 %, P≈957,88 € : décote."
        resultat: "P(4 %)≈1 044,52 €; P(5 %)=1 000 €; P(6 %)≈957,88 €."
        interpretation: "Le prix évolue en sens inverse du rendement exigé, car les flux contractuels restent fixes."
        controles:
          - "Recalculer par somme de coupons actualisés et remboursement."
          - "Le prix à 5 % doit être exactement le nominal à la précision numérique."
      - titre: "Prix par courbe spot et taux à terme"
        enonce: "Courbe fictive s_1=3 %, s_2=3,5 %, s_3=4 %. Prix d'une obligation 3 ans, nominal 1 000 €, coupon 5 %; calculer aussi les taux à terme entre les années 1 et 2, puis 2 et 3."
        raisonnement:
          - "P=50/1,03+50/1,035²+1 050/1,04³."
          - "Les taux à terme découlent de l'équivalence des facteurs de capitalisation."
          - "f_{1→2}=(1,035²/1,03)−1≈4,0024 %."
          - "f_{2→3}=(1,04³/1,035²)−1≈5,0073 %."
        resultat: "Prix≈1 028,67 €; f_{1→2}≈4,0024 %; f_{2→3}≈5,0073 %."
        interpretation: "Le prix spot actualise chaque coupon à son taux propre; les forwards sont implicites et ne constituent pas des prévisions garanties."
        controles:
          - "Vérifier chaque PV individuellement."
          - "Comparer le prix à celui d'un YTM proche de 3,9677 %."
      - titre: "Duration et convexité"
        enonce: "Pour l'obligation 5 ans nominal 1 000 €, coupon 5 %, YTM 4 %, calculer les sensibilités."
        raisonnement:
          - "Prix≈1 044,5182 €."
          - "Duration Macaulay≈4,5571 ans; duration modifiée≈4,3818."
          - "Convexité conventionnelle≈24,4766."
          - "Pour un choc de +1 point de rendement, l'approximation de second ordre donne une variation relative d'environ −4,2594 %."
        resultat: "D_Mac≈4,5571; D_mod≈4,3818; Conv≈24,4766."
        interpretation: "La duration mesure la sensibilité locale; la convexité corrige la courbure. Une repricing exacte est préférable pour un choc significatif."
        controles:
          - "Comparer l'approximation à P(5 %)−P(4 %)."
          - "Les poids des PV doivent sommer à 1."
